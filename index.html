<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA redirect decode (pairs with public/404.html). Restores
         the real path from the ?/ query the 404 shim produced, before
         BrowserRouter reads the URL. No-op on normal loads. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Critical background so the prerendered homepage (injected into #root at
         build time for crawlers) paints on-brand before the bundle's CSS loads
         and React replaces it. -->
    <style>html,body{margin:0;background-color:#0b0f17;color:#f8fafc;font-family:Inter,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}#root{opacity:0}html.app-ready #root{opacity:1;transition:opacity .1s ease-out}</style>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SXG8M67HPV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // github.io is a public-suffix domain, so gtag's default cookie_domain
      // of 'auto' tries (and fails) to set cookies on github.io itself.
      // send_page_view:false: gtag's automatic pageview reports page_location =
      // the raw URL, which on the /yahoo-success OAuth return carries tokens.
      // The app sends sanitized, path-only page_views itself (src/utils/analytics).
      // Hostname gate: this file ships as-is to dev and preview too (no build
      // templating), and without config GA4's auto-collection (session_start,
      // engagement) would report local traffic into the production property.
      if (window.location.hostname === 'fantasyfootballanalyzer.app') {
        gtag('config', 'G-SXG8M67HPV', {
          cookie_domain: window.location.hostname,
          content_group: 'Witching Hour',
          send_page_view: false,
          page_location: window.location.origin + window.location.pathname,
        });
      }
    </script>
    <!-- Preload the UI face; other weights and JetBrains Mono load on demand. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-wght-normal.woff2">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Safety net for the opacity-0 #root fade-in: if the bundle never mounts
         (failed JS load), still reveal #root so the prerendered content shows
         instead of a blank screen. The app flips this class on mount, long
         before this fires. -->
    <script>setTimeout(function(){document.documentElement.classList.add('app-ready')},2500)</script>
  </body>
